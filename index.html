<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ホーム画面追加(PWA風)設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="マイ予定">
<meta name="theme-color" content="#eaf3fb">
<title>マイ予定</title>
<style>
:root{
  --bg:#eef3f8; --card:#ffffff; --ink:#27323f; --sub:#6b7a8a;
  --blue:#4a90c2; --blue-d:#33769f; --blue-l:#dcebf7; --line:#d9e2ea;
  --red:#c8574f; --gray:#e6ebf0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  line-height:1.5; font-size:16px;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}

/* 日付・時刻 */
.clock{padding:18px 6px 12px}
.date{font-size:1.05rem;color:var(--sub);font-weight:600}
.time{font-size:3.2rem;font-weight:700;letter-spacing:.02em;line-height:1.1;color:var(--blue-d);font-variant-numeric:tabular-nums}

h2{font-size:1rem;margin:22px 4px 8px;color:var(--sub)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}

/* フォーム */
input[type=text],input[type=time],select{
  width:100%;height:48px;font-size:1rem;padding:0 12px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;
}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>.t{flex:0 0 130px}
.btn{
  height:48px;padding:0 16px;font-size:1rem;font-weight:600;font-family:inherit;
  border:none;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer;
}
.btn:active{background:var(--blue-d)}
.btn.full{width:100%}
.btn.ghost{background:var(--gray);color:var(--ink)}
.btn.sm{height:40px;min-width:56px;padding:0 12px;font-size:.9rem}
.btn.del{background:#f7e4e2;color:var(--red)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

/* 現在の予定 */
.now{border:2px solid var(--blue)}
.cat-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cat-time{background:var(--blue-l);color:var(--blue-d);font-weight:700;border-radius:8px;padding:2px 10px;font-variant-numeric:tabular-nums}
.cat-name{font-size:1.15rem;font-weight:700;flex:1;word-break:break-all}
.badge{font-size:.8rem;color:var(--sub);margin-bottom:4px}
.todo{display:flex;align-items:center;gap:8px;min-height:52px;border-top:1px solid var(--line)}
.todo label{flex:1;display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer;word-break:break-all}
.todo input[type=checkbox]{width:26px;height:26px;accent-color:var(--blue);flex:0 0 auto}
.todo.done .txt{text-decoration:line-through;color:var(--sub)}
.acts{display:flex;gap:6px}
.empty{color:var(--sub);text-align:center;padding:14px 0}
details summary{cursor:pointer;color:var(--sub);padding:10px 4px;font-weight:600}
.dim{opacity:.7}
</style>
</head>
<body>
<div class="wrap">

  <div class="clock">
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
  </div>

  <h2>いま取り組む予定</h2>
  <div id="current"></div>

  <h2>予定を追加</h2>
  <form class="card" id="catForm">
    <div class="row">
      <input class="t" type="time" id="catTime" required aria-label="時間">
      <input type="text" id="catName" placeholder="例: 出勤の準備" required aria-label="カテゴリー名">
    </div>
    <button class="btn full" type="submit">予定を追加</button>
  </form>

  <form class="card" id="todoForm">
    <div class="row">
      <select id="todoCat" aria-label="追加先の予定"></select>
    </div>
    <div class="row">
      <input type="text" id="todoText" placeholder="例: 持ち物の確認" required aria-label="ToDo">
    </div>
    <button class="btn full" type="submit">ToDoを追加</button>
  </form>

  <h2>すべての予定(編集・削除)</h2>
  <div id="all"></div>

  <button class="btn ghost full" id="reset" style="margin-top:8px">チェックをすべて外す(翌日用)</button>
</div>

<script>
const KEY = 'myScheduleApp.v1';
let data = load();           // [{id, time:'07:00', name, todos:[{id,text,done}]}]

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
  render();
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const $ = id => document.getElementById(id);

/* ---- 日付と時刻 ---- */
function tick(){
  const n = new Date();
  const w = ['日','月','火','水','木','金','土'][n.getDay()];
  $('date').textContent = `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日(${w})`;
  const hm = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  $('time').textContent = hm;
  if(tick.last !== hm){ tick.last = hm; render(); }   // 1分ごとに表示を更新
}
function nowHM(){
  const n = new Date();
  return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}

/* ---- 表示する予定の選び方 ---- */
function isAllDone(c){ return c.todos.length > 0 && c.todos.every(t => t.done); }
function pickCurrent(){
  const active = data.filter(c => !isAllDone(c)).sort((a,b) => a.time.localeCompare(b.time));
  if(!active.length) return null;
  const now = nowHM();
  const started = active.filter(c => c.time <= now);
  if(started.length) return started[started.length-1];   // 予定時間になった中で最も新しい
  return active[0];                                       // なければ最も近い次の予定
}

/* ---- 部品 ---- */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function btn(label, cls, fn){
  const b = el('button', 'btn sm ' + cls, label);
  b.type = 'button';
  b.onclick = fn;
  return b;
}

function todoRow(c, t, withEdit){
  const row = el('div', 'todo' + (t.done ? ' done' : ''));
  const lab = el('label');
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = t.done;
  cb.onchange = () => { t.done = cb.checked; save(); };
  lab.append(cb, el('span', 'txt', t.text));
  const acts = el('div', 'acts');
  if(withEdit) acts.append(btn('編集', 'ghost', () => editTodo(t)));
  acts.append(btn('削除', 'del', () => { if(confirm('このToDoを削除しますか?')){ c.todos = c.todos.filter(x => x !== t); save(); } }));
  row.append(lab, acts);
  return row;
}

function catCard(c, opts){
  const card = el('div', 'card' + (opts.now ? ' now' : '') + (opts.dim ? ' dim' : ''));
  const head = el('div', 'cat-head');
  head.append(el('span', 'cat-time', c.time), el('span', 'cat-name', c.name));
  card.append(head);
  if(opts.manage){
    const acts = el('div', 'acts');
    acts.style.marginBottom = '6px';
    acts.append(
      btn('編集', 'ghost', () => editCat(c)),
      btn('削除', 'del', () => { if(confirm(`「${c.name}」とその中のToDoをすべて削除しますか?`)){ data = data.filter(x => x !== c); save(); } })
    );
    card.append(acts);
  }
  if(!c.todos.length) card.append(el('div', 'empty', 'ToDoがありません'));
  c.todos.forEach(t => card.append(todoRow(c, t, opts.manage)));
  return card;
}

/* ---- 描画 ---- */
function render(){
  // 現在の予定
  const cur = $('current'); cur.textContent = '';
  const c = pickCurrent();
  if(c){
    cur.append(catCard(c, {now:true}));
  }else{
    cur.append(el('div', 'card empty', data.length ? 'すべて完了しました 🎉' : '予定を追加してください'));
  }

  // ToDo追加先セレクト
  const sel = $('todoCat'); const keep = sel.value; sel.textContent = '';
  [...data].sort((a,b) => a.time.localeCompare(b.time)).forEach(x => {
    const o = el('option', '', `${x.time}  ${x.name}`); o.value = x.id; sel.append(o);
  });
  if(!data.length){ const o = el('option','','先に予定を追加してください'); o.value=''; sel.append(o); }
  else if(data.some(x => x.id === keep)) sel.value = keep;

  // 一覧(完了していない予定 / 完了済みの予定)
  const all = $('all'); all.textContent = '';
  const sorted = [...data].sort((a,b) => a.time.localeCompare(b.time));
  const open = sorted.filter(x => !isAllDone(x));
  const done = sorted.filter(isAllDone);
  if(!sorted.length) all.append(el('div', 'card empty', 'まだ予定がありません'));
  open.forEach(x => all.append(catCard(x, {manage:true})));
  if(done.length){
    const d = el('details'); d.append(el('summary', '', `完了した予定(${done.length})`));
    done.forEach(x => d.append(catCard(x, {manage:true, dim:true})));
    all.append(d);
  }
}

/* ---- 追加・編集 ---- */
$('catForm').onsubmit = e => {
  e.preventDefault();
  const name = $('catName').value.trim();
  if(!name) return;
  data.push({id: uid(), time: $('catTime').value, name, todos: []});
  $('catName').value = '';
  save();
};
$('todoForm').onsubmit = e => {
  e.preventDefault();
  const cat = data.find(x => x.id === $('todoCat').value);
  const text = $('todoText').value.trim();
  if(!cat){ alert('先に予定を追加してください'); return; }
  if(!text) return;
  cat.todos.push({id: uid(), text, done:false});
  $('todoText').value = '';
  save();
};
function editTodo(t){
  const v = prompt('ToDoを編集', t.text);
  if(v !== null && v.trim()){ t.text = v.trim(); save(); }
}
function editCat(c){
  const name = prompt('予定の名前を編集', c.name);
  if(name === null) return;
  const time = prompt('時間を編集(例 07:30)', c.time);
  if(name.trim()) c.name = name.trim();
  if(time !== null && /^([01]\d|2[0-3]):[0-5]\d$/.test(time.trim())) c.time = time.trim();
  else if(time !== null) alert('時間は 07:30 の形式で入力してください(名前のみ変更しました)');
  save();
}
$('reset').onclick = () => {
  if(confirm('すべてのチェックを外しますか?')){
    data.forEach(c => c.todos.forEach(t => t.done = false));
    save();
  }
};

/* ---- 起動 ---- */
tick(); render();
setInterval(tick, 1000);
</script>
</body>
</html>
